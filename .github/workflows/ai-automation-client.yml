name: AunuWise AI Automation

on:
  # 1. Pemicu Issue & Komentar (baca, balas, auto-fix)
  issues:
    types: [opened]
  issue_comment:
    types: [created]

  # 2. Pemicu Pull Request (review + auto-accept / auto-tolak)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  # 3. Cron — 00:00 UTC = 07:00 WIB (scan penuh harian)
  #    + tiap 30 menit (sweep ringan: CI gagal & triase issue)
  schedule:
    - cron: '0 0 * * *'
    - cron: '*/30 * * * *'

  # 4. Manual (+ input instruksi opsional)
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Instruksi tambahan untuk AI (opsional)'
        required: false
        default: ''

# Mencegah dua job untuk target yang sama jalan barengan (tabrakan push)
concurrency:
  group: ai-automation-saas-client-${{ github.event.pull_request.number || github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

# GITHUB_TOKEN hanya untuk BACA (checkout, gh pr/run/issue). Semua write
# (commit/issue/release/merge) dikerjakan worker server-side via /v1/agent/*
# memakai GitHub App — workflow tidak pernah memegang kredensial tulis.
permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read

jobs:
  ai-process:
    # Cegah loop via tipe Bot; balasan bot sendiri (akun User) ditangani di script
    # via deteksi awalan "### 🤖" agar perintah user dari akun mana pun tetap jalan.
    # Pengecualian: komentar dari app Sourcery di PR memicu review ulang yang
    # membaca temuan bug & fix-nya (hanya bila integrasi Sourcery repo aktif).
    if: "github.event.sender.type != 'Bot' || github.event.sender.login == 'sourcery-ai[bot]'"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # ===== DIISI OTOMATIS OLEH SISTEM SAAS — JANGAN UBAH MANUAL =====
      # (tidak ada token GitHub di sini — semua aksi GitHub dikerjakan server SaaS)
      AI_API_KEY: sk_ccfb808ca97a3f3e2f40017021c82777356a5c859a11dc79
      AI_ENDPOINT: 'https://request.sryze.cc/v1/chat/completions'
      AI_MODEL: 'mold'
      AI_MAX_TOKENS: '16000'
      GITHUB_REPO: ${{ github.repository }}  # dipakai untuk header X-Repo (whitelist SaaS)
      GH_TOKEN: ${{ github.token }}  # hanya BACA: gh pr diff/checks, gh run list/log, gh issue list

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # --prefix RUNNER_TEMP: node_modules ditaruh sejajar dengan ai_agent.mjs
        # agar ESM resolver Node menemukannya (script memang sengaja di luar repo)
        run: npm install --prefix "$RUNNER_TEMP" axios @actions/core @actions/github

      - name: Run AI Agent
        run: |
          # Script ditulis ke RUNNER_TEMP agar TIDAK ikut ter-commit ke repo
          cat << 'EOF' > "$RUNNER_TEMP/ai_agent.mjs"
          import axios from 'axios';
          import * as github from '@actions/github';
          import * as core from '@actions/core';
          import fs from 'fs';
          import path from 'path';
          import { execSync } from 'child_process';

          const REPO_ROOT = process.cwd();
          const MAX_CONTEXT_BYTES = 80000; // budget konteks kode untuk AI

          function sh(cmd) {
            return execSync(cmd, { cwd: REPO_ROOT, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
          }

          // JSON extractor toleran: buang markdown fence, atau ambil substring { ... }
          function extractJSON(raw) {
            let t = String(raw).trim()
              .replace(/^```json\s*/i, '')
              .replace(/^```\s*/, '')
              .replace(/\s*```$/, '');
            try { return JSON.parse(t); } catch { /* lanjut ke ekstraksi */ }
            const s = t.indexOf('{');
            const e = t.lastIndexOf('}');
            if (s !== -1 && e > s) return JSON.parse(t.slice(s, e + 1));
            throw new Error('AI tidak mengembalikan JSON valid');
          }

          // Tolak path traversal (../, absolute path)
          function safePath(p) {
            const n = path.normalize(String(p)).replace(/^(\.\.(\/|\\|$))+/, '');
            if (!n || n === '.' || n.startsWith('..') || path.isAbsolute(n)) {
              throw new Error(`Path tidak aman, dilewati: ${p}`);
            }
            return n;
          }

          // Bangun konteks repo: struktur file + isi file (budget 80KB)
          function buildRepoContext() {
            let files = [];
            try {
              files = sh('git ls-files').split('\n').map(f => f.trim()).filter(Boolean);
            } catch { files = []; }
            // .github/workflows DIKECUALIKAN: berisi license key (sk_...) hasil inject — jangan sampai ke upstream AI.
            const SKIP = [/package-lock\.json$/, /yarn\.lock$/, /\.min\.js$/, /\.github\/workflows\/.*\.ya?ml$/, /\.(png|jpe?g|gif|ico|mp4|zip|tar\.gz|woff2?)$/i];
            const redactSecrets = (t) => t.replace(/sk_[a-f0-9]{16,}/gi, 'sk_[REDACTED]');
            const tree = files.join('\n');
            let budget = MAX_CONTEXT_BYTES;
            const parts = [];
            for (const f of files) {
              if (budget <= 0) break;
              if (SKIP.some(rx => rx.test(f))) continue;
              let content;
              try {
                const full = path.join(REPO_ROOT, f);
                const st = fs.statSync(full);
                if (!st.isFile() || st.size > 40000) continue;
                content = fs.readFileSync(full, 'utf8');
              } catch { continue; }
              if (content.includes('\0')) continue; // binary, lewati
              const chunk = `\n\n===== FILE: ${f} =====\n${redactSecrets(content).slice(0, budget)}`;
              parts.push(chunk);
              budget -= chunk.length;
            }
            return { tree, contents: parts.join(''), truncated: budget <= 0 };
          }

          // Tag release berikutnya: bump patch dari release terakhir (v1.2.3 -> v1.2.4)
          // Bump patch lokal: v1.2.3 -> v1.2.4
          function bumpPatch(tag) {
            const m = String(tag || '').match(/v?(\d+)\.(\d+)\.(\d+)/);
            if (m) return `v${m[1]}.${m[2]}.${parseInt(m[3], 10) + 1}`;
            return 'v1.0.0';
          }

          // Judul release berikutnya mengikuti POLA judul release sebelumnya:
          // hanya versinya yang diganti (tag baru tetap dari bumpPatch).
          // Contoh: "AunuBaileys v1.0.7" + tag v1.0.8 -> "AunuBaileys v1.0.8".
          function releaseNameFromPrevious(previous, nextTag, fallbackName) {
            const prevName = String((previous && previous.latest_name) || '').trim();
            if (!prevName) return fallbackName;
            const prevTag = String((previous && previous.latest_tag) || '');
            if (prevTag && prevName.includes(prevTag)) return prevName.split(prevTag).join(nextTag);
            const version = prevName.match(/v?\d+\.\d+\.\d+/);
            if (version) return prevName.replace(version[0], nextTag);
            if (prevName.toLowerCase().includes(String(nextTag).toLowerCase())) return prevName;
            return `${prevName} ${nextTag}`;
          }

          // Isi release: catatan dari AI adalah isinya; release sebelumnya hanya
          // menyumbang kerangka yang aman dipertahankan — heading versi dan baris
          // penutup proses/footer (mis. "Published to npm automatically by ...").
          // Klaim isi lama TIDAK disalin: fakta lama bisa tidak berlaku lagi.
          function releaseBodyFromPrevious(previous, notes, nextTag, fallback) {
            const prevTag = String((previous && previous.latest_tag) || '');
            const swapVersion = (text) => prevTag ? String(text || '').split(prevTag).join(nextTag) : String(text || '');
            let body = swapVersion(String(notes || '').trim());
            if (!body) body = swapVersion(String(fallback || '').trim());
            if (!body) body = `Pembaruan ${nextTag}.`;
            const prevBlocks = String((previous && previous.latest_body) || '')
              .split(/\n\s*\n/).map((x) => x.trim()).filter(Boolean);
            if (prevBlocks.length) {
              const first = prevBlocks[0];
              if (first.length <= 120 && (/^#{1,6}\s/.test(first) || (prevTag && first.includes(prevTag)))) {
                const opening = swapVersion(first);
                if (!body.startsWith(opening)) body = `${opening}\n\n${body}`;
              }
              const last = prevBlocks[prevBlocks.length - 1];
              if (/^(published|released|generated|otomatis|dibuat|di-generate)\b/i.test(last)) {
                const closing = swapVersion(last);
                if (!body.includes(closing)) body += `\n\n${closing}`;
              }
            }
            return body;
          }

          // Panggil Worker Agent API — SEMUA mutasi GitHub (commit, release,
          // komentar issue, tutup issue, merge/tutup PR, laporan CI) dikerjakan
          // server SaaS dengan GitHub App. Workflow ini TIDAK PERNAH memegang
          // kredensial tulis GitHub.
          // Auth: license key + header X-Repo (sama seperti proxy AI).
          async function agentCall(apiPath, body, method = 'POST') {
            const base = String(process.env.AI_ENDPOINT).replace(/\/v1\/chat\/completions$/, '');
            const r = await axios({
              method,
              url: base + apiPath,
              data: method === 'GET' ? undefined : body,
              headers: {
                'Authorization': `Bearer ${process.env.AI_API_KEY}`,
                'X-Repo': process.env.GITHUB_REPO,
                'Content-Type': 'application/json'
              },
              timeout: 120000
            });
            return r.data;
          }

          // Tambah entri ke CHANGELOG.md (terbaru di atas)
          function updateChangelog(explanation, files) {
            const p = path.join(REPO_ROOT, 'CHANGELOG.md');
            const date = new Date().toISOString().slice(0, 10);
            const entry = `## ${date} — ${explanation}\n\n${files.map(f => `- \`${f}\``).join('\n')}\n`;
            let head = '# Changelog\n\n';
            let rest = '';
            try {
              const cur = fs.readFileSync(p, 'utf8');
              const nl = cur.indexOf('\n');
              if (cur.startsWith('#') && nl !== -1) {
                head = cur.slice(0, nl + 1) + '\n';
                rest = cur.slice(nl + 1).replace(/^\n+/, '');
              } else if (!cur.startsWith('#')) {
                rest = cur;
              }
            } catch { /* file belum ada, buat baru */ }
            fs.writeFileSync(p, head + entry + '\n' + rest, 'utf8');
            console.log('CHANGELOG.md diperbarui.');
          }

          async function run() {
            const context = github.context;
            const apiKey = process.env.AI_API_KEY;
            if (!apiKey) throw new Error('AI_API_KEY belum diisi — file ini harus dipasang via dashboard SaaS');

            const isIssueEvent = context.eventName === 'issues' || context.eventName === 'issue_comment';
            const isPR = !!(context.payload.issue && context.payload.issue.pull_request);

            // Anti-loop: balasan bot selalu diawali "### 🤖". Jika komentar pemicu adalah
            // balasan bot sendiri, stop di sini (exit 0) — jangan panggil AI / kirim komentar baru.
            // Deteksi ISI (bukan nama akun) agar perintah user dari akun AunuPivots/IKBAL-rgb tetap jalan.
            if (context.eventName === 'issue_comment') {
              const trigBody = String((context.payload.comment && context.payload.comment.body) || '');
              if (trigBody.startsWith('### 🤖')) {
                console.log('Komentar pemicu adalah balasan bot sendiri — skip agar tidak loop.');
                process.exit(0);
              }
            }

            // ===== KUSTOMISASI: sesuaikan deskripsi project & aturan brand di bawah =====
            const systemPrompt = `Anda adalah AI senior developer untuk project ini. Pelajari stack & struktur repo dari konteks yang diberikan, lalu analisis kode, perbaiki bug, optimasi, atau implementasi fitur sesuai permintaan.
            Tugas: analisis kode, perbaiki bug, optimasi, atau implementasi fitur.

            ATURAN KERAS:
            1. Respons HANYA JSON valid, tanpa markdown fence, tanpa teks tambahan.
            2. Format: { "explanation": "penjelasan singkat (Indonesia)", "files_to_update": [ { "path": "relatif/dari/repo", "content": "isi LENGKAP file" } ], "should_release": true/false, "release_notes": "..." }
            3. "content" harus isi file UTUH, bukan diff/potongan.
            4. Perubahan minimal dan aman. JANGAN hapus file, JANGAN tulis secret/key ke kode, JANGAN ubah workflow CI.
            5. Jika tidak ada yang perlu diubah, kembalikan "files_to_update": [].
            6. "should_release": true HANYA jika ada perubahan yang terlihat user (fitur/fix penting). Jangan release untuk refactor kecil.
            7. BRANDING (sesuaikan dengan project-mu): jika ada nama brand / footer wajib, pertahankan di setiap output yang terlihat user. Contoh: "footer WAJIB bertuliskan NCHMPK Team".
            8. UI HARUS KEREN: setiap halaman/komponen baru atau yang diperbaiki HARUS modern, rapi, dan responsif mobile-first — JANGAN buat tampilan polos/membosankan.
            9. JANGAN PERNAH memotong JSON di tengah. Jika banyak file perlu diubah, dahulukan yang terpenting (maks 3 file per respons) — lebih baik sedikit file yang lengkap daripada banyak yang terpotong.
            10. Jika prompt memuat FORMAT RELEASE SEBELUMNYA, tulis "release_notes" mengikuti format itu: bahasa, urutan blok, pola paragraf/bullet, tingkat detail, dan baris penutup proses/footer yang masih berlaku. JANGAN menyalin klaim/fakta lama — isi harus menjelaskan perubahan saat ini, dan nomor versi yang disebut harus versi baru.`;

            let userPrompt = '';
            if (isIssueEvent) {
              const issue = context.payload.issue;
              userPrompt = `Ada laporan/permintaan dari GitHub Issue.\nJudul: ${issue.title}\nDeskripsi: ${issue.body || '(kosong)'}`;
              if (context.eventName === 'issue_comment') {
                userPrompt += `\nKomentar tambahan: ${context.payload.comment.body}`;
              }
              if (isPR) {
                userPrompt += `\n\nCATATAN: ini komentar pada Pull Request — JANGAN ubah file apa pun, cukup berikan analisis/jawaban. Kembalikan files_to_update kosong.`;
              } else {
                const ctx = buildRepoContext();
                userPrompt += `\n\nStruktur file repo:\n${ctx.tree}\n${ctx.contents}\n\nLakukan auto-fix jika ini bug, atau implementasikan jika ini permintaan fitur.`;
              }
            } else {
              const ctx = buildRepoContext();
              const manual = (context.payload.inputs && context.payload.inputs.instruction || '').trim();
              userPrompt = `Ini pemindaian otomatis terjadwal untuk project ini. `
                + `Periksa kode berikut, cari bug nyata, inkonsistensi, atau optimasi yang bermakna. `
                + `Jangan mengarang masalah — jika kode sudah baik, kembalikan files_to_update kosong.`
                + (manual ? `\nInstruksi manual: ${manual}` : '')
                + `\n\nStruktur file repo:\n${ctx.tree}\n${ctx.contents}`;
            }

            // Batas tunggu AI: diisi dari pre-flight (timeout upstream di server + 60s
            // margin). Default 360s bila server lama belum mengirim nilainya.
            let aiTimeoutMs = 360000;

            // Penjelasan error HTTP dari endpoint — 524 = lapisan proxy memutus
            // koneksi (bukan salah workflow / bukan upstream mati).
            function explainHttpError(e) {
              const st = e.response && e.response.status;
              const d = e.response && e.response.data;
              const serverMsg = d && typeof d === 'object' ? d.error : (typeof d === 'string' ? d : '');
              if (st === 524) return 'Error 524: koneksi diputus lapisan proxy Cloudflare karena upstream terlalu lama diam. Token mungkin tetap terpakai di upstream. Minta admin mengecek pengaturan timeout server.';
              return serverMsg || e.message;
            }

            // Panggil AI dengan retry: jika respons bukan JSON valid, minta ulang (maks 3x)
            async function callAI(messages, attempt = 1) {
              console.log(`Menghubungi AI endpoint... (percobaan ${attempt})`);
              const resp = await axios.post(process.env.AI_ENDPOINT, {
                model: process.env.AI_MODEL || 'mold',
                response_format: { type: 'json_object' },
                temperature: 0.3,
                max_tokens: parseInt(process.env.AI_MAX_TOKENS || '16000', 10),
                messages
              }, {
                headers: { 'Authorization': `Bearer ${apiKey}`, 'X-Repo': process.env.GITHUB_REPO, 'Content-Type': 'application/json' },
                timeout: aiTimeoutMs
              });
              // Endpoint kini selalu membalas JSON terstruktur: sukses berisi
              // choices, gagal berisi { error } (termasuk bila respons dikirim
              // via streaming keep-alive dengan status 200). Tampilkan pesan
              // aslinya — jangan tutupi dengan "format tidak valid".
              if (resp.data && typeof resp.data === 'object' && resp.data.error) {
                const em = typeof resp.data.error === 'string' ? resp.data.error : JSON.stringify(resp.data.error);
                throw new Error('Endpoint AI error: ' + String(em).slice(0, 500));
              }
              const choice = resp.data && resp.data.choices && resp.data.choices[0];
              if (!choice || !choice.message || typeof choice.message.content !== 'string') {
                throw new Error('Endpoint tidak mengembalikan format chat completion valid: ' + JSON.stringify(resp.data).slice(0, 500));
              }
              const raw = choice.message.content;
              try {
                return extractJSON(raw);
              } catch {
                const truncated = !raw.trim().endsWith('}');
                console.log(`Percobaan ${attempt} gagal parse${truncated ? ' (respons TERPOTONG)' : ''}. Cuplikan respons AI:\n${raw.slice(0, 1500)}`);
                if (attempt >= 3) throw new Error('AI tidak mengembalikan JSON valid setelah 3 percobaan');
                const fixMsg = truncated
                  ? 'Respons di atas TERPOTONG karena terlalu panjang. Ulangi dengan LEBIH SEDIKIT file (maks 2 file terpenting saja), tapi setiap file HARUS lengkap dan JSON harus valid sampai kurung kurawal tutup terakhir. Tanpa teks lain, tanpa markdown fence.'
                  : 'Respons di atas BUKAN JSON valid. Ulangi SEKARANG hanya dengan JSON mentah: tanpa teks pembuka/penutup, tanpa markdown fence.';
                console.log('Mencoba lagi...');
                return callAI([
                  ...messages,
                  { role: 'assistant', content: raw.slice(0, 4000) },
                  { role: 'user', content: fixMsg }
                ], attempt + 1);
              }
            }

            // ===== FITUR: review PR (auto-accept / auto-tolak), sweep CI gagal, triase issue =====
            // Ketiganya menghormati toggle owner yang dibaca dari pre-flight
            // (features.pr_review / features.ci_check di /v1/agent/check-access).
            async function handlePR(xBot, prNumber, sourceryOn, fromSourcery) {
              const payloadPr = context.payload.pull_request || null;
              const repoFull = process.env.GITHUB_REPO || '';
              let view;
              try {
                view = JSON.parse(sh(`gh pr view ${prNumber} --json title,body,additions,deletions,changedFiles,files,headRefOid,baseRefName,headRefName,isDraft,author,state`));
              } catch (e) {
                console.log('gh pr view gagal (akses baca PR?): ' + e.message); return;
              }
              if (view.state && view.state !== 'OPEN') { console.log('PR tidak terbuka — skip.'); return; }
              const isDraft = payloadPr ? !!payloadPr.draft : !!view.isDraft;
              if (isDraft) { console.log('PR masih draft — skip.'); return; }
              const authorLogin = payloadPr ? String((payloadPr.user || {}).login || '') : String((view.author || {}).login || '');
              const authorBot = payloadPr ? (payloadPr.user || {}).type === 'Bot' : !!(view.author && view.author.is_bot);
              if (authorBot || /\[bot\]$/i.test(authorLogin)) { console.log('PR dibuat bot — skip.'); return; }
              const files = (view.files || []).map((f) => f.path).filter(Boolean);
              let diff = '';
              try { diff = sh(`gh pr diff ${prNumber}`); } catch { diff = ''; }
              if (diff.length > 60000) diff = diff.slice(0, 60000) + '\n…(diff dipotong)';
              let checksState = 'none';
              let checksLines = 'Tidak ada check yang terdaftar.';
              try {
                const cr = JSON.parse(sh(`gh api "repos/${repoFull}/commits/${view.headRefOid}/check-runs?per_page=100"`));
                const runs = Array.isArray(cr.check_runs) ? cr.check_runs : [];
                if (runs.length) {
                  const FAIL = ['failure', 'timed_out', 'cancelled', 'action_required', 'startup_failure'];
                  if (runs.some((r) => r.status !== 'completed')) checksState = 'pending';
                  else if (runs.some((r) => FAIL.includes(r.conclusion))) checksState = 'failure';
                  else checksState = 'success';
                  checksLines = runs.map((r) => `- ${r.name}: ${r.status === 'completed' ? r.conclusion : r.status}`).join('\n');
                }
              } catch { /* check-runs tidak terbaca — anggap none */ }
              const touchesWorkflow = files.some((f) => f.startsWith('.github/workflows/'));
              const totalChanges = (Number(view.additions) || 0) + (Number(view.deletions) || 0);
              const tooBig = totalChanges > 2000;

              // Temuan Sourcery (hanya bila integrasi repo ini aktif): bug & fix
              // dari app Sourcery menjadi bukti tambahan bagi reviewer. Hasil
              // review Sourcery hanya muncul per PR di GitHub (daftar bug
              // repo-wide hanya ada di web dashboard Sourcery) — dan PR yang
              // terlewat tidak di-review otomatis, jadi bila belum ada temuan
              // bot MEMICU review-nya (komentar perintah + label).
              let sourceryItems = [];
              let sourceryText = '';
              let sf = null;
              if (sourceryOn) {
                try {
                  sf = await agentCall(`/v1/agent/sourcery?issue_number=${prNumber}&head_sha=${view.headRefOid}`, {}, 'GET');
                } catch (e) { console.log('Baca temuan Sourcery gagal: ' + e.message); }
                // Run ini dipicu komentar Sourcery, tapi verdict untuk commit
                // ini sudah pernah diposting → jangan bakar kuota AI lagi.
                if (fromSourcery && sf && sf.verdict_posted) {
                  console.log('Verdict untuk commit ini sudah diposting — skip review ulang.');
                  return;
                }
                if (sf && sf.enabled && sf.found && Array.isArray(sf.items)) {
                  sourceryItems = sf.items;
                  sourceryText = sourceryItems.map((it, i) => `[${i + 1}] (${it.kind}${it.path ? ' ' + it.path : ''}) ${String(it.body || '').slice(0, 1200)}${(it.suggestions || []).length ? '\nSaran fix Sourcery:\n' + it.suggestions.join('\n---\n') : ''}`).join('\n\n').slice(0, 20000);
                  console.log(`Temuan Sourcery terbaca: ${sourceryItems.length} item.`);
                } else if (sf && sf.enabled) {
                  try {
                    const tr = await agentCall('/v1/agent/sourcery-trigger', { issue_number: prNumber, head_sha: view.headRefOid });
                    if (tr) console.log(`Trigger Sourcery: komentar=${tr.commented || '-'} label=${tr.label ? 'ok' : 'tidak'} — temuannya dipakai pada review berikutnya.`);
                  } catch (e) { console.log('Trigger Sourcery gagal: ' + e.message); }
                }
              }

              const prSystem = `Anda adalah reviewer Pull Request senior yang KETAT tapi adil untuk repo ini.
              Balas HANYA JSON valid: {"verdict":"accept|reject|hold","confidence":0-100,"summary":"ringkasan (Indonesia)","findings":[{"severity":"critical|major|minor","file":"path","note":"..."}]}
              Aturan verdict:
              - "reject" HANYA bila jelas: kode berbahaya/merusak (hapus data, celah keamanan, secret ter-hardcode, backdoor), bug kritis yang pasti, PR spam/kosong/tidak terkait repo, atau perubahan yang pasti merusak build.
              - "accept" HANYA bila perubahan fokus, aman, konsisten dengan repo, dan tidak ada temuan critical/major.
              - Selain itu "hold" — manusia yang memutuskan.
              - confidence harus jujur; di bawah 80 berarti tindakan otomatis tidak akan dijalankan.
              - Bila prompt memuat TEMUAN SOURCERY: bug kritis dari Sourcery yang cocok dengan diff adalah alasan kuat untuk hold/reject; sebutkan saran fix Sourcery yang relevan di findings.`;
              const prUser = `Pull Request #${prNumber}: ${view.title}\nBranch: ${view.headRefName} -> ${view.baseRefName}\nDeskripsi: ${String(view.body || '(kosong)').slice(0, 3000)}\n\nFile berubah (${files.length}):\n${files.join('\n')}\n\nStatus CI/checks: ${checksState}\n${checksLines}\n\nDiff:\n${diff || '(diff tidak terbaca)'}${sourceryText ? `\n\nTEMUAN SOURCERY (dari app review Sourcery — bukti tambahan, verifikasi ke diff):\n${sourceryText}` : ''}`;
              const v = await callAI([{ role: 'system', content: prSystem }, { role: 'user', content: prUser }]);
              const verdict = ['accept', 'reject', 'hold'].includes(v.verdict) ? v.verdict : 'hold';
              const conf = Math.max(0, Math.min(100, Number(v.confidence) || 0));

              let action = 'none';
              let actionNote = '';
              if (verdict === 'accept') {
                if (conf < 80) actionNote = `Keyakinan AI ${conf}% (< 80) — tidak di-merge otomatis.`;
                else if (touchesWorkflow) actionNote = 'PR menyentuh .github/workflows/ — wajib review manusia, tidak pernah auto-merge.';
                else if (tooBig) actionNote = `Perubahan terlalu besar (${totalChanges} baris) — wajib review manusia.`;
                else if (checksState === 'failure') actionNote = 'Ada CI/check yang GAGAL — tidak di-merge.';
                else if (checksState === 'pending') actionNote = 'CI/check masih berjalan — merge menunggu hijau.';
                else {
                  const mr = await agentCall('/v1/agent/pr-merge', { pr_number: prNumber, head_sha: view.headRefOid, commit_title: `Merge PR #${prNumber}: ${String(view.title).slice(0, 120)}` });
                  if (mr && mr.ok) action = 'merged';
                  else {
                    action = 'merge-failed';
                    actionNote = `Merge otomatis gagal: ${(mr && mr.message) || 'tidak diketahui'}${mr && mr.status === 403 ? ' — kemungkinan permission "Pull requests: Read & write" pada GitHub App belum disetujui instalasi.' : ''}`;
                  }
                }
              } else if (verdict === 'reject') {
                if (conf < 80) actionNote = `Keyakinan AI ${conf}% (< 80) — tidak ditutup otomatis.`;
                else {
                  const cl = await agentCall('/v1/agent/pr-close', { pr_number: prNumber });
                  if (cl && cl.ok) action = 'closed';
                  else {
                    action = 'close-failed';
                    actionNote = `Tutup PR otomatis gagal: ${(cl && cl.message) || 'tidak diketahui'}${cl && cl.status === 403 ? ' — kemungkinan permission "Pull requests: Read & write" pada GitHub App belum disetujui instalasi.' : ''}`;
                  }
                }
              }
              const emoji = verdict === 'accept' ? '✅' : verdict === 'reject' ? '❌' : '⏸️';
              const actionLine = action === 'merged' ? '🚀 **PR ini sudah di-merge otomatis oleh bot.**'
                : action === 'closed' ? '🔒 **PR ini sudah ditutup otomatis oleh bot (ditolak).**'
                : actionNote ? `ℹ️ Tidak ada aksi otomatis: ${actionNote}` : 'ℹ️ Tidak ada aksi otomatis — menunggu keputusan manusia.';
              const findings = Array.isArray(v.findings) ? v.findings.slice(0, 15) : [];
              const srcSection = sourceryItems.length
                ? `**Temuan Sourcery (${sourceryItems.length}):**\n${sourceryItems.slice(0, 6).map((it) => `- (${it.kind}${it.path ? ' `' + it.path + '`' : ''}) ${String(it.body || '').replace(/\s+/g, ' ').slice(0, 160)}${(it.suggestions || []).length ? ' — 💡 ada saran fix' : ''}`).join('\n')}\n\n`
                : '';
              const body = `### 🤖 ${xBot} PR Check\n\n${emoji} **Verdict: ${verdict.toUpperCase()}** — keyakinan ${conf}%\n\n${String(v.summary || 'Tidak ada ringkasan.').slice(0, 4000)}\n\n`
                + (findings.length ? `**Temuan:**\n${findings.map((f) => `- [${f.severity || 'minor'}] \`${f.file || '-'}\` — ${String(f.note || '').slice(0, 300)}`).join('\n')}\n\n` : '')
                + srcSection
                + `**CI/checks:** ${checksState}\n\n${actionLine}\n\n---\n*🤖 Ditenagai ${xBot} — AunuCore*`;
              try {
                const cm = await agentCall('/v1/agent/comment', { issue_number: prNumber, body, marker: `pr-check:${view.headRefOid}` });
                console.log(cm && cm.deduped ? 'Komentar PR untuk commit ini sudah ada (dedupe).' : 'Komentar PR terkirim.');
              } catch (e) { console.log('Komentar PR gagal: ' + e.message); }
              console.log(`PR #${prNumber}: verdict=${verdict} conf=${conf} action=${action}`);
            }

            async function sweepCI(xBot) {
              const repoFull = process.env.GITHUB_REPO || '';
              let runs;
              try {
                runs = JSON.parse(sh('gh run list --status failure --limit 10 --json databaseId,workflowName,headBranch,headSha,url,createdAt'));
              } catch { console.log('gh run list gagal — sweep CI dilewati.'); return; }
              if (!Array.isArray(runs) || !runs.length) return;
              const ownWorkflow = String(context.workflow || '');
              const freq = String((context.payload || {}).schedule || '').includes('*/30');
              const windowMs = freq ? 40 * 60 * 1000 : 25 * 3600 * 1000;
              for (const r of runs) {
                if (!r || r.workflowName === ownWorkflow) continue; // jangan laporkan workflow bot sendiri
                if (Date.now() - new Date(r.createdAt).getTime() > windowMs) continue;
                const slug = String(r.workflowName || 'workflow').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'workflow';
                const branchSlug = String(r.headBranch || 'main').replace(/[^a-zA-Z0-9_\-.]+/g, '-').slice(0, 60);
                const issueMarker = `ci:${slug}:${branchSlug}`;
                const runMarker = `ci-run:${r.databaseId}`;
                let seen;
                try { seen = await agentCall('/v1/agent/ci-seen', { issue_marker: issueMarker, run_marker: runMarker }); } catch { continue; }
                if (seen && seen.disabled) { console.log('Fitur cek CI dimatikan owner — sweep berhenti.'); return; }
                if (seen && seen.seen) continue;
                let logs = '';
                try { logs = sh(`gh run view ${r.databaseId} --log-failed`); } catch { logs = ''; }
                const logTail = logs ? logs.slice(-12000) : '(log gagal tidak terbaca)';
                let prNumber = null;
                try {
                  const prs = JSON.parse(sh(`gh api "repos/${repoFull}/commits/${r.headSha}/pulls"`));
                  if (Array.isArray(prs) && prs.length && prs[0].state === 'open') prNumber = prs[0].number;
                } catch { /* tanpa PR terkait */ }
                let diag;
                try {
                  diag = await callAI([
                    { role: 'system', content: 'Anda adalah engineer CI/CD senior. Analisis log kegagalan CI berikut dan balas HANYA JSON valid: {"diagnosis":"penyebab dalam 1-3 kalimat (Indonesia)","likely_cause":"akar masalah paling mungkin","suggested_fix":"langkah perbaikan konkret"}' },
                    { role: 'user', content: `Workflow "${r.workflowName}" gagal di branch ${r.headBranch} (${r.url}).\n\nLog bagian gagal (ekor):\n${logTail}` },
                  ]);
                } catch (e) { console.log('Diagnosis CI gagal: ' + e.message); continue; }
                const bodyCi = `### 🤖 ${xBot} CI Check\n\n❌ Workflow **${r.workflowName}** gagal di branch \`${r.headBranch}\` — [lihat run](${r.url})\n\n**Diagnosis:** ${String(diag.diagnosis || '-').slice(0, 1500)}\n\n**Kemungkinan penyebab:** ${String(diag.likely_cause || '-').slice(0, 1500)}\n\n**Saran perbaikan:** ${String(diag.suggested_fix || '-').slice(0, 2000)}\n\n<details><summary>Cuplikan log yang gagal</summary>\n\n\`\`\`\n${logTail.slice(-3500)}\n\`\`\`\n</details>\n\n---\n*🤖 Ditenagai ${xBot} — AunuCore*`;
                try {
                  const rep = await agentCall('/v1/agent/ci-report', { issue_marker: issueMarker, run_marker: runMarker, title: `❌ CI gagal: ${r.workflowName} (${r.headBranch})`, body: bodyCi, ...(prNumber ? { pr_number: prNumber } : {}) });
                  console.log(`CI ${r.workflowName} run ${r.databaseId}: ${rep && rep.action}`);
                } catch (e) { console.log('ci-report gagal: ' + e.message); }
              }
            }

            async function sweepIssues(xBot) {
              let list;
              try {
                list = JSON.parse(sh('gh issue list --state open --limit 30 --json number,title,author,createdAt'));
              } catch { return; }
              if (!Array.isArray(list)) return;
              let done = 0;
              for (const it of list) {
                if (done >= 2) break;
                if (!it || !it.author || it.author.is_bot) continue;
                let view;
                try { view = JSON.parse(sh(`gh issue view ${it.number} --json body,comments`)); } catch { continue; }
                const comments = Array.isArray(view.comments) ? view.comments : [];
                if (comments.some((c) => String(c.body || '').startsWith('### 🤖'))) continue;
                let tri;
                try {
                  tri = await callAI([
                    { role: 'system', content: 'Anda adalah triage engineer. Baca issue berikut dan balas HANYA JSON valid: {"analysis":"analisis singkat masalah & kemungkinan lokasi di repo (Indonesia)","needs":"info tambahan yang perlu diminta dari pelapor, atau string kosong bila cukup jelas"}' },
                    { role: 'user', content: `Issue #${it.number}: ${it.title}\n\n${String(view.body || '(kosong)').slice(0, 4000)}\n\nStruktur repo:\n${String(buildRepoContext().tree).slice(0, 6000)}` },
                  ]);
                } catch { continue; }
                const bodyT = `### 🤖 ${xBot} Triage\n\n${String(tri.analysis || 'Issue diterima dan dicatat.').slice(0, 3000)}\n\n`
                  + (tri.needs ? `**Info yang dibutuhkan:** ${String(tri.needs).slice(0, 800)}\n\n` : '')
                  + `Komentar ini triase berkala agar tidak ada issue yang terlewat tanpa tanggapan. Auto-fix penuh berjalan saat issue dibuat atau saat ada komentar baru.\n\n---\n*🤖 Ditenagai ${xBot} — AunuCore*`;
                try {
                  await agentCall('/v1/agent/comment', { issue_number: it.number, body: bodyT, marker: `issue-triage:${it.number}` });
                  done++;
                  console.log(`Triase issue #${it.number} terkirim.`);
                } catch { /* lanjut ke issue berikutnya */ }
              }
            }

            const isPREvent = context.eventName === 'pull_request';
            const isSourceryPRComment = context.eventName === 'issue_comment'
              && !!(context.payload.issue && context.payload.issue.pull_request)
              && String(((context.payload.comment || {}).user || {}).login || '') === 'sourcery-ai[bot]';
            const isFrequentCron = String((context.payload || {}).schedule || '').includes('*/30');
            if (isPREvent || isSourceryPRComment || context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              let pf;
              try {
                pf = await agentCall('/v1/agent/check-access', {}, 'GET');
              } catch (e) {
                const msg = (e.response && e.response.data && e.response.data.error) || e.message;
                throw new Error(`Pre-flight gagal, AI tidak dipanggil (hemat token): ${msg}`);
              }
              const xBot = (pf && pf.bot && pf.bot.display_name) || 'AunuWise';
              if (pf && pf.upstream_timeout_s) aiTimeoutMs = (Number(pf.upstream_timeout_s) + 60) * 1000;
              const feats = (pf && pf.features) || { pr_review: true, ci_check: true };
              if (isPREvent || isSourceryPRComment) {
                const prNum = isPREvent ? context.payload.pull_request.number : context.payload.issue.number;
                if (feats.pr_review) await handlePR(xBot, prNum, !!(pf && pf.sourcery), isSourceryPRComment);
                else console.log('Fitur review PR dimatikan owner — skip.');
                return;
              }
              if (feats.ci_check) await sweepCI(xBot);
              else console.log('Fitur cek CI dimatikan owner — sweep CI dilewati.');
              await sweepIssues(xBot);
              if (isFrequentCron) { console.log('Sweep selesai (cron 30 menit) — scan penuh hanya di cron harian.'); return; }
              console.log('Sweep selesai — lanjut scan reguler.');
            }

            // Pre-flight: pastikan bot punya akses tulis SEBELUM panggil AI.
            // Gagal di sini = gagal cepat tanpa membuang token/kuota AI.
            let botName = 'AunuWise';
            let previousRelease = null;
            try {
              const chk = await agentCall('/v1/agent/check-access', {}, 'GET');
              if (chk && chk.bot && chk.bot.display_name) botName = chk.bot.display_name;
              if (chk && chk.upstream_timeout_s) {
                aiTimeoutMs = (Number(chk.upstream_timeout_s) + 60) * 1000;
                console.log(`Timeout AI disesuaikan: ${Math.round(aiTimeoutMs / 1000)} detik (mengikuti pengaturan server).`);
              }
              console.log(`Pre-flight OK — akses tulis ${botName} terkonfirmasi. Lanjut ke AI.`);
              // Ambil format release terakhir (judul + isi) agar release_notes AI
              // dan judul release berikutnya mengikuti format yang sudah dipakai.
              // Tag TIDAK dipakai sebagai format — tag baru tetap dihitung bumpPatch.
              try {
                previousRelease = await agentCall('/v1/agent/release-info', {}, 'GET');
                if (previousRelease && previousRelease.has_any && (previousRelease.latest_name || previousRelease.latest_body)) {
                  userPrompt += `\n\nFORMAT RELEASE SEBELUMNYA (ikuti sebagai format, bukan sebagai isi):\nJudul: ${String(previousRelease.latest_name || '').slice(0, 200)}\nIsi:\n${String(previousRelease.latest_body || '').slice(0, 6000)}\n\nTulis release_notes dengan bahasa, urutan blok, pola paragraf/bullet, dan tingkat detail yang sama. Pertahankan baris penutup yang bersifat proses/footer bila masih berlaku. Jangan menyalin klaim lama.`;
                  console.log('Format release sebelumnya ditemukan — release berikutnya mengikuti format itu.');
                }
              } catch { previousRelease = null; }
            } catch (e) {
              const msg = (e.response && e.response.data && e.response.data.error) || e.message;
              throw new Error(`Pre-flight gagal, AI tidak dipanggil (hemat token): ${msg}`);
            }

            let aiData;
            try {
              aiData = await callAI([
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userPrompt }
              ]);
            } catch (e) {
              throw new Error(explainHttpError(e));
            }
            console.log('AI response parsed OK:', aiData.explanation);

            // 1. Tulis file + CHANGELOG, lalu commit VIA WORKER (dilewati untuk komentar PR).
            //    Tidak ada git push / token tulis GitHub di sini — worker yang commit pakai GitHub App.
            let didCommit = false;
            const updates = (aiData.files_to_update || []).filter(f => f && f.path && typeof f.content === 'string');
            if (updates.length > 0 && !isPR) {
              const written = [];
              for (const f of updates) {
                let p;
                try {
                  p = safePath(f.path);
                } catch (e) {
                  console.warn(`Lewati file tidak aman: ${f.path} (${e.message})`);
                  continue;
                }
                fs.mkdirSync(path.dirname(path.join(REPO_ROOT, p)), { recursive: true });
                fs.writeFileSync(path.join(REPO_ROOT, p), f.content, 'utf8');
                written.push(p);
                console.log(`Ditulis: ${p}`);
              }
              const explanation = String(aiData.explanation || 'Perbaikan otomatis');
              updateChangelog(explanation, written); // changelog ikut commit yang sama
              // Porcelain v1 = 'XY<spasi>path' (2 kolom status fixed-width). JANGAN trim() leading —
              // ' M config.js'.trim().slice(3) = 'onfig.js' (huruf pertama hilang!) → file tak terbaca → commit skip.
              const changed = sh('git status --porcelain').split('\n').map(l => l.replace(/\s+$/, '')).filter(l => l.trim().length > 2);
              if (changed.length === 0) {
                console.log('Tidak ada perubahan aktual — skip commit.');
              } else {
                const files = [];
                const seen = new Set();
                let totalBytes = 0;
                const MAX_FILE_BYTES = 200000, MAX_TOTAL_BYTES = 400000;
                for (const line of changed) {
                  let cp = line.slice(3);
                  const arrow = cp.indexOf(' -> ');
                  if (arrow !== -1) cp = cp.slice(arrow + 4); // handle rename
                  cp = cp.replace(/^"(.*)"$/, '$1');
                  if (!cp || seen.has(cp)) continue;
                  seen.add(cp);
                  const full = path.join(REPO_ROOT, cp);
                  try {
                    const st = fs.statSync(full);
                    if (!st.isFile()) continue;
                    if (st.size > MAX_FILE_BYTES) { console.warn(`Lewati (terlalu besar): ${cp}`); continue; }
                    if (totalBytes + st.size > MAX_TOTAL_BYTES) { console.warn(`Batas total payload tercapai — sisa file dilewati.`); break; }
                    const content = fs.readFileSync(full, 'utf8');
                    totalBytes += Buffer.byteLength(content);
                    files.push({ path: cp, content });
                  } catch { /* file terhapus — AI dilarang menghapus, lewati */ }
                }
                if (files.length === 0) {
                  console.log('Tidak ada file valid untuk di-commit — skip.');
                } else {
                  const issueRef = isIssueEvent ? ` (#${context.payload.issue.number})` : '';
                  const msg = `🤖 ${botName} Auto-Fix${issueRef}: ${explanation.slice(0, 120)}`;
                  const branch = process.env.GITHUB_REF_NAME || 'main';
                  const cres = await agentCall('/v1/agent/commit', { branch, message: msg, files });
                  didCommit = true;
                  console.log('Commit via worker berhasil:', cres.sha || 'ok');
                }
              }
            } else if (updates.length > 0 && isPR) {
              console.log('Komentar PR: file tidak diubah, hanya analisis.');
            } else {
              console.log('AI tidak meminta perubahan file.');
            }

            // 2. Balas issue/komentar + tandai closed jika sudah selesai (via worker, identitas bot App)
            if (isIssueEvent) {
              const issue_number = context.payload.issue.number;
              let ibody = `### 🤖 ${botName} Bot Report\n\n${aiData.explanation || 'Dianalisis.'}\n\n`;
              if (didCommit) {
                ibody += `**File yang diperbarui:**\n` + updates.map(f => `- \`${safePath(f.path)}\``).join('\n') + `\n- \`CHANGELOG.md\``;
              } else {
                ibody += `*Tidak ada file yang diubah.*`;
              }
              ibody += `\n\n---\n*🤖 Ditenagai ${botName} — AunuCore*`;
              await agentCall('/v1/agent/comment', { issue_number, body: ibody });
              console.log('Komentar balasan terkirim via worker.');
              if (didCommit && !isPR) {
                await agentCall('/v1/agent/close-issue', { issue_number });
                console.log('Issue ditandai closed.');
              }
            }

            // 3. Release via worker: bootstrap v1.0.0 jika belum ada release sama sekali,
            //    selebihnya hanya jika ada commit baru & AI merekomendasikan
            const relInfo = previousRelease || await agentCall('/v1/agent/release-info', {}, 'GET');
            if (!relInfo.has_any) {
              await agentCall('/v1/agent/release', {
                tag_name: 'v1.0.0',
                name: 'Release v1.0.0 - Initial',
                body: `Rilis perdana otomatis oleh ${botName} (AunuCore).`
              });
              console.log('Rilis perdana v1.0.0 langsung dibuat.');
            } else if (aiData.should_release === true && didCommit) {
              const tag = bumpPatch(relInfo.latest_tag);
              const releaseName = releaseNameFromPrevious(relInfo, tag, `Release ${tag} - ${botName}`);
              const releaseBody = releaseBodyFromPrevious(relInfo, aiData.release_notes, tag, aiData.explanation);
              await agentCall('/v1/agent/release', {
                tag_name: tag,
                name: releaseName,
                body: releaseBody
              });
              console.log(`Release baru dibuat: ${tag} — ${releaseName} (format mengikuti release sebelumnya)`);
            } else {
              console.log('Skip release.');
            }
          }

          run().catch(err => {
            console.error('Error:', err.response ? JSON.stringify(err.response.data) : err.message);
            core.setFailed(err.message);
          });
          EOF

          node "$RUNNER_TEMP/ai_agent.mjs"
