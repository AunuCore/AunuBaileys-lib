# Publish `@aunucore/baileys` to npm automatically.
#
# Since the rename at 1.0.73, the canonical npm name is
# `@aunucore/baileys`. package.json keeps the legacy name
# `aunubaileys` (frozen at 1.0.73 and deprecated on npm); the
# publish job below rewrites the name in the runner before
# publishing — the same pattern publish-ghp.yml uses.
#
# How it works:
#   1. Bump "version" in package.json (one step at a time: 1.0.5 -> 1.0.6).
#   2. Create a GitHub Release with the tag v<version> (e.g. v1.0.6).
#   3. This workflow publishes that exact version to npm.
# It can also be run manually from the Actions tab (workflow_dispatch) —
# it publishes whatever version package.json currently says.
#
# One-time setup (repo owner): Settings -> Secrets and variables -> Actions
# -> New repository secret:  NPM_TOKEN  = an npm Classic token of type
# "Automation" (the only type that bypasses 2FA for publishing).

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Guard — release tag must match package.json version
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match release tag ($TAG). Bump package.json first."
            exit 1
          fi
          echo "Publishing @aunucore/baileys@$PKG"

      - name: Scope the package name for npmjs (canonical name since 1.0.73)
        run: npm pkg set name=@aunucore/baileys

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
